
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Blog Application</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fa;
    color: #222;
}

header {
    background: #253858;
    color: white;
    padding: 22px;
    text-align: center;
}

.container {
    max-width: 800px;
    margin: 25px auto;
    padding: 15px;
}

.form-box, .blog-card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px #ddd;
}

input, textarea {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
}

textarea {
    height: 120px;
}

button {
    padding: 11px 16px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    margin: 5px;
}

.delete-btn {
    background: #dc3545;
}

.edit-btn {
    background: #198754;
}

h2 {
    color: #253858;
}

.blog-card p {
    line-height: 1.6;
    white-space: pre-wrap;
}
</style>
</head>

<body>

<header>
    <h1>My Blog Application</h1>
    <p>Share Your Thoughts With The World</p>
</header>

<div class="container">

    <div class="form-box">
        <h2>Create New Blog</h2>

        <input type="text" id="title"
        placeholder="Enter Blog Title">

        <textarea id="content"
        placeholder="Write your blog here..."></textarea>

        <button onclick="addBlog()">Publish Blog</button>
    </div>

    <h2>Latest Blog Posts</h2>

    <div id="blogList"></div>

</div>

<script>
let blogs = [];
let editIndex = -1;

function addBlog() {
    const title = document.getElementById("title").value.trim();
    const content = document.getElementById("content").value.trim();

    if (!title || !content) {
        alert("Please enter title and content!");
        return;
    }

    if (editIndex === -1) {
        blogs.unshift({
            title: title,
            content: content
        });
    } else {
        blogs[editIndex] = {
            title: title,
            content: content
        };
        editIndex = -1;
    }

    document.getElementById("title").value = "";
    document.getElementById("content").value = "";

    displayBlogs();
}

function displayBlogs() {
    const blogList = document.getElementById("blogList");

    if (blogs.length === 0) {
        blogList.innerHTML = "<p>No blog posts yet.</p>";
        return;
    }

    blogList.innerHTML = blogs.map((blog, index) => `
        <div class="blog-card">
            <h2>${escapeHTML(blog.title)}</h2>
            <p>${escapeHTML(blog.content)}</p>

            <button class="edit-btn"
            onclick="editBlog(${index})">Edit</button>

            <button class="delete-btn"
            onclick="deleteBlog(${index})">Delete</button>
        </div>
    `).join("");
}

function editBlog(index) {
    document.getElementById("title").value = blogs[index].title;
    document.getElementById("content").value = blogs[index].content;
    editIndex = index;
    window.scrollTo(0, 0);
}

function deleteBlog(index) {
    if (confirm("Are you sure you want to delete this blog?")) {
        blogs.splice(index, 1);
        displayBlogs();
    }
}

function escapeHTML(text) {
    return text.replace(/[&<>"']/g, function(char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        }[char];
    });
}

displayBlogs();
</script>

</body>
</html>
